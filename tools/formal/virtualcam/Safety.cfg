\* Order, session and size rules. Code constants: 4 readback slots, a 6-frame ring.
\* MaxFrames > RingSlots, so a slot is reused while a consumer reads it.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    EngineSlots = 2
    RingSlots = 2
    MaxFrames = 3
    MaxChanges = 2
INVARIANTS TypeOK NoStepBack OneSessionPerQueue ProducerFits
